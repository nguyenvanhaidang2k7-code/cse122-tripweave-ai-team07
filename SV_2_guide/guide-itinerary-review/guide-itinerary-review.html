<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TripWeave AI — Review lịch trình</title>
  <link rel="stylesheet" href="guide-itinerary-review.css" />
</head>
<body>

  <!-- ===================== TOP HEADER ===================== -->
  <header class="topbar">
    <a class="brand" href="../guide-dashboard/guide-dashboard.html" title="Về trang chủ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 4.5 20 19H4Z"/></svg>
      TripWeave AI
    </a>
    <form class="searchbar" id="globalSearch" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="globalSearchInput" type="text" placeholder="Tìm kiếm địa điểm, thành phố, hoạt động..." autocomplete="off" />
    </form>
    <div class="topbar-actions">
      <button class="icon-btn" id="syncBtn" type="button" title="Đồng bộ dữ liệu (demo)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V6m0 0-3.5 3.5M12 6l3.5 3.5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="avatar" id="avatarBtn" type="button" title="Đăng xuất"></button>
    </div>
  </header>

  <!-- ===================== LAYOUT ===================== -->
  <div class="layout">
    <aside class="sidebar">
      <nav class="side-nav" aria-label="Điều hướng hướng dẫn viên">
        <a class="side-link" href="../guide-dashboard/guide-dashboard.html">Trang chủ</a>
        <a class="side-link" href="../guide-curated/guide-curated.html">Curated</a>
        <a class="side-link" href="../guide-locations/guide-locations.html">Địa điểm</a>
        <a class="side-link active" href="../guide-itinerary-review/guide-itinerary-review.html">Review lịch trình</a>
        <a class="side-link" href="../guide-experiences/guide-experiences.html">Trải nghiệm</a>
        <a class="side-link" href="../guide-profile/guide-profile.html">Hồ sơ</a>
      </nav>
      <div class="side-spacer"></div>
      <div class="side-divider"></div>
      <div class="side-role">Hướng dẫn viên</div>
    </aside>

    <main class="content">
      <div class="content-rule" aria-hidden="true"></div>

      <!-- Tab lọc theo trạng thái duyệt -->
      <div class="tabs" id="statusTabs" role="tablist">
        <button class="tab active" data-status="all" type="button">Tất cả</button>
        <button class="tab" data-status="pending" type="button">Chờ duyệt</button>
        <button class="tab" data-status="approved" type="button">Đã duyệt</button>
        <button class="tab" data-status="rejected" type="button">Từ chối</button>
      </div>

      <!-- Danh sách lịch trình (render bằng JS) -->
      <section class="stack" id="itineraryList"></section>
    </main>
  </div>

  <!-- ===================== MODAL TỪ CHỐI ===================== -->
  <div class="modal-backdrop" id="rejectModal">
    <div class="modal">
      <div class="modal-head">
        <h2 class="modal-title">Từ chối lịch trình</h2>
        <button class="modal-close" data-close="rejectModal" type="button">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">Vui lòng nêu lý do từ chối để điều phối viên điều chỉnh lịch trình.</p>
        <div class="field" id="fieldReason">
          <label for="rejectReason">Lý do từ chối</label>
          <textarea class="textarea" id="rejectReason" placeholder="VD: Thời gian di chuyển giữa các điểm quá dày..."></textarea>
          <span class="field-error">Lý do cần tối thiểu 5 ký tự.</span>
        </div>
      </div>
      <div class="modal-foot">
        <span class="spacer"></span>
        <button class="btn btn-light" data-close="rejectModal" type="button">Hủy</button>
        <button class="btn btn-danger" id="confirmRejectBtn" type="button">Xác nhận từ chối</button>
      </div>
    </div>
  </div>

  <div class="toast-region" id="toastRegion"></div>
  <script src="guide-itinerary-review.js"></script>
</body>
</html>
