<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TripWeave AI — Chi tiết lịch trình</title>
  <link rel="stylesheet" href="guide-itinerary-detail.css" />
</head>
<body>

  <!-- ===================== TOP HEADER ===================== -->
  <header class="topbar">
    <a class="brand" href="../guide-dashboard/guide-dashboard.html" title="Về trang chủ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 4.5 20 19H4Z"/></svg>
      TripWeave AI
    </a>
    <form class="searchbar" id="globalSearch" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="globalSearchInput" type="text" placeholder="Tìm kiếm địa điểm, thành phố, hoạt động..." autocomplete="off" />
    </form>
    <div class="topbar-actions">
      <button class="icon-btn" id="syncBtn" type="button" title="Đồng bộ dữ liệu (demo)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V6m0 0-3.5 3.5M12 6l3.5 3.5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="avatar" id="avatarBtn" type="button" title="Đăng xuất"></button>
    </div>
  </header>

  <!-- ===================== LAYOUT ===================== -->
  <div class="layout">
    <aside class="sidebar">
      <nav class="side-nav" aria-label="Điều hướng hướng dẫn viên">
        <a class="side-link" href="../guide-dashboard/guide-dashboard.html">Trang chủ</a>
        <a class="side-link" href="../guide-curated/guide-curated.html">Curated</a>
        <a class="side-link" href="../guide-locations/guide-locations.html">Địa điểm</a>
        <a class="side-link active" href="../guide-itinerary-review/guide-itinerary-review.html">Review lịch trình</a>
        <a class="side-link" href="../guide-experiences/guide-experiences.html">Trải nghiệm</a>
        <a class="side-link" href="../guide-profile/guide-profile.html">Hồ sơ</a>
      </nav>
      <div class="side-spacer"></div>
      <div class="side-divider"></div>
      <div class="side-role">Hướng dẫn viên</div>
    </aside>

    <main class="content">
      <div class="content-rule" aria-hidden="true"></div>

      <!-- Tiêu đề lịch trình + badge trạng thái -->
      <section class="card detail-head">
        <h1 id="tripTitle">Lịch trình: ...</h1>
        <span class="badge badge-pending" id="tripBadge">Chờ duyệt</span>
      </section>

      <!-- Danh sách ngày (render bằng JS) -->
      <section class="stack" id="dayList"></section>

      <!-- Hành động cuối trang -->
      <div class="detail-foot">
        <button class="btn btn-ghost btn-lg" id="editTripBtn" type="button">Sửa</button>
        <button class="btn btn-primary btn-lg" id="approveTripBtn" type="button">Duyệt</button>
      </div>
    </main>
  </div>

  <!-- ============ MODAL NHẬN XÉT NGÀY (kèm AI gợi ý) ============ -->
  <div class="modal-backdrop" id="commentModal">
    <div class="modal">
      <div class="modal-head">
        <h2 class="modal-title" id="commentModalTitle">Nhận xét</h2>
        <button class="modal-close" data-close="commentModal" type="button">✕</button>
      </div>
      <div class="modal-body">
        <div class="field" id="fieldComment">
          <label for="commentInput">Nhận xét của hướng dẫn viên</label>
          <textarea class="textarea" id="commentInput" placeholder="VD: Nên bắt đầu ngày sớm hơn để tránh giờ cao điểm..."></textarea>
          <span class="field-error">Nhận xét không được để trống.</span>
        </div>

        <!-- AI mô phỏng: gợi ý nhận xét -->
        <div class="ai-panel">
          <div class="ai-head">✨ Gợi ý nhận xét từ AI</div>
          <button class="btn btn-ghost btn-sm" id="aiSuggestBtn" type="button">Phân tích lịch trình</button>
          <div id="aiZone"></div>
        </div>
      </div>
      <div class="modal-foot">
        <span class="spacer"></span>
        <button class="btn btn-light" data-close="commentModal" type="button">Hủy</button>
        <button class="btn btn-primary" id="saveCommentBtn" type="button">Lưu nhận xét</button>
      </div>
    </div>
  </div>

  <!-- ============ MODAL SỬA LỊCH TRÌNH ============ -->
  <div class="modal-backdrop" id="editModal">
    <div class="modal">
      <div class="modal-head">
        <h2 class="modal-title">Sửa lịch trình</h2>
        <button class="modal-close" data-close="editModal" type="button">✕</button>
      </div>
      <div class="modal-body" id="editModalBody"></div>
      <div class="modal-foot">
        <span class="spacer"></span>
        <button class="btn btn-light" data-close="editModal" type="button">Hủy</button>
        <button class="btn btn-primary" id="saveEditBtn" type="button">Lưu thay đổi</button>
      </div>
    </div>
  </div>
  <div class="toast-region" id="toastRegion"></div>
  <script src="guide-itinerary-detail.js"></script>
</body>
</html>
