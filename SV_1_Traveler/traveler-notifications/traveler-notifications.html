<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripWeave AI – Thông báo</title>
  <!-- CSS riêng của trang (bên trong đã @import common.css) -->
  <link rel="stylesheet" href="traveler-notifications.css">
</head>
<body>

  <!-- ===================== TOPBAR (khung chung mọi trang) ===================== -->
  <header class="topbar">
    <a class="topbar__logo" href="../traveler-discover/traveler-discover.html">
      <!-- Icon tam giác logo -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 3 22 20 H2 Z"></path>
      </svg>
      TripWeave AI
    </a>

    <!-- Ô tìm kiếm chính giữa (bản demo: ô nhập trang trí) -->
    <div class="topbar__search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path>
      </svg>
      <input type="text" placeholder="Tìm kiếm địa điểm, thành phố, hoạt động...">
    </div>

    <div class="topbar__actions">
      <!-- Chuông: common.js gắn sự kiện sang trang Thông báo + badge đếm số -->
      <span class="topbar__bell">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
        </svg>
      </span>
      <!-- Avatar: common.js điền viết tắt tên từ key "userProfile" -->
      <span class="topbar__avatar"></span>
    </div>
  </header>

  <div class="layout">
    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar">
      <nav class="sidebar__nav">
        <a class="nav-item" href="../traveler-discover/traveler-discover.html">Khám phá</a>
        <a class="nav-item" href="../traveler-trip-planner/traveler-trip-planner.html">Chuyến đi</a>
        <a class="nav-item" href="../traveler-ai-itinerary/traveler-ai-itinerary.html">AI Itinerary</a>
        <a class="nav-item" href="../traveler-saved/traveler-saved.html">Đã lưu</a>
        <a class="nav-item is-active" href="traveler-notifications.html">Thông báo</a>
        <a class="nav-item" href="../traveler-settings/traveler-settings.html">Cài đặt</a>
      </nav>
      <div class="sidebar__footer">Du khách</div>
    </aside>

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="main">
      <section class="panel">
        <!-- Tiêu đề trang -->
        <div class="page-head">
          <h1 class="page-head__title">Thông báo</h1>
          <p class="page-head__sub">Cập nhật hoạt động, ưu đãi và nhắc nhở dành cho bạn.</p>
        </div>

        <!-- Hàng tab lọc: [Tất cả | Hệ thống | Ưu đãi | Cập nhật] – JS render -->
        <div class="notif-tabs" id="notifTabs"></div>

        <!-- Danh sách thông báo: JS đọc key "notifications" rồi render -->
        <div class="notif-list" id="notifList"></div>
      </section>
    </main>
  </div>

  <!-- JS dùng chung: seed dữ liệu + avatar + chuông thông báo -->
  <script src="../../common.js"></script>
  <!-- JS riêng của trang -->
  <script src="traveler-notifications.js"></script>
</body>
</html>
