<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripWeave AI – Lập kế hoạch chuyến đi</title>
  <!-- CSS riêng của trang (bên trong đã @import common.css) -->
  <link rel="stylesheet" href="traveler-trip-planner.css">
</head>
<body>

  <!-- ===================== TOPBAR (khung chung mọi trang) ===================== -->
  <header class="topbar">
    <a class="topbar__logo" href="../traveler-discover/traveler-discover.html">
      <!-- Icon tam giác logo -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 3 22 20 H2 Z"></path>
      </svg>
      TripWeave AI
    </a>

    <!-- Ô tìm kiếm chính giữa (bản demo: ô nhập trang trí) -->
    <div class="topbar__search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path>
      </svg>
      <input type="text" placeholder="Tìm kiếm địa điểm, thành phố, hoạt động...">
    </div>

    <div class="topbar__actions">
      <span class="topbar__bell">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
        </svg>
      </span>
      <span class="topbar__avatar"></span>
    </div>
  </header>

  <div class="layout">
    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar">
      <nav class="sidebar__nav">
        <a class="nav-item" href="../traveler-discover/traveler-discover.html">Khám phá</a>
        <a class="nav-item is-active" href="traveler-trip-planner.html">Chuyến đi</a>
        <a class="nav-item" href="../traveler-ai-itinerary/traveler-ai-itinerary.html">AI Itinerary</a>
        <a class="nav-item" href="../traveler-saved/traveler-saved.html">Đã lưu</a>
        <a class="nav-item" href="../traveler-notifications/traveler-notifications.html">Thông báo</a>
        <a class="nav-item" href="../traveler-settings/traveler-settings.html">Cài đặt</a>
      </nav>
      <div class="sidebar__footer">Du khách</div>
    </aside>

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="main">
      <section class="panel planner">
        <h1 class="planner__title">Lập kế hoạch chuyến đi</h1>
        <p class="planner__subtitle">Điền thông tin để AI tạo lịch trình phù hợp với bạn.</p>

        <div class="planner__cols">
          <!-- Cột trái: form nhập liệu -->
          <div class="planner__form">

            <!-- Tên chuyến đi -->
            <div class="form-group">
              <label class="form-label" for="tripName">Tên chuyến đi</label>
              <input class="form-input" id="tripName" type="text"
                     placeholder="VD: Du lịch miền Bắc 4 ngày">
            </div>

            <!-- Điểm đến: chip chọn nhiều, JS render -->
            <div class="form-group">
              <span class="form-label">Điểm đến (chọn nhiều)</span>
              <div class="chip-row" id="destChips"></div>
            </div>

            <!-- Ngày bắt đầu / Ngày kết thúc nằm cùng 1 hàng -->
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="startDate">Ngày bắt đầu</label>
                <input class="form-input" id="startDate" type="date">
              </div>
              <div class="form-group">
                <label class="form-label" for="endDate">Ngày kết thúc</label>
                <input class="form-input" id="endDate" type="date">
              </div>
            </div>

            <!-- Ngân sách: chip chọn 1 -->
            <div class="form-group">
              <span class="form-label">Ngân sách dự kiến</span>
              <div class="chip-row" id="budgetChips"></div>
            </div>

            <!-- Sở thích: chip chọn nhiều -->
            <div class="form-group">
              <span class="form-label">Sở thích (chọn nhiều)</span>
              <div class="chip-row" id="interestChips"></div>
            </div>

            <!-- Ghi chú thêm -->
            <div class="form-group">
              <label class="form-label" for="tripNote">Ghi chú thêm</label>
              <textarea class="form-input planner__note" id="tripNote" rows="3"
                        placeholder="VD: đi cùng gia đình, không thích đi sớm..."></textarea>
            </div>
          </div>

          <!-- Cột phải: ô ảnh giả minh họa -->
          <div class="img-placeholder planner__img">Ảnh minh họa</div>
        </div>

        <!-- Nút tạo lịch trình: lưu currentTrip rồi sang trang AI Itinerary -->
        <button class="btn btn--primary btn--block" id="createBtn">Tạo lịch trình AI</button>
        <p class="planner__hint">
          <span class="tag-chip">AI sẽ đề xuất lịch trình dựa trên thông tin bạn nhập</span>
        </p>
        <p class="planner__error" id="errorMsg" hidden></p>
      </section>
    </main>
  </div>

  <!-- JS dùng chung: seed dữ liệu + avatar + chuông thông báo -->
  <script src="../../common.js"></script>
  <!-- JS riêng của trang -->
  <script src="traveler-trip-planner.js"></script>
</body>
</html>
