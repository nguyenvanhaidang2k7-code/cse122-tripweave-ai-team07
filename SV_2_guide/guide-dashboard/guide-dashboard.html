<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TripWeave AI — Trang chủ hướng dẫn viên</title>
  <link rel="stylesheet" href="guide-dashboard.css" />
</head>
<body>

  <!-- ===================== TOP HEADER ===================== -->
  <header class="topbar">
    <a class="brand" href="../guide-dashboard/guide-dashboard.html" title="Về trang chủ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 4.5 20 19H4Z"/></svg>
      TripWeave AI
    </a>

    <!-- Thanh tìm kiếm toàn cục (demo) -->
    <form class="searchbar" id="globalSearch" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="globalSearchInput" type="text" placeholder="Tìm kiếm địa điểm, thành phố, hoạt động..." autocomplete="off" />
    </form>

    <div class="topbar-actions">
      <button class="icon-btn" id="syncBtn" type="button" title="Đồng bộ dữ liệu (demo)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V6m0 0-3.5 3.5M12 6l3.5 3.5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="avatar" id="avatarBtn" type="button" title="Đăng xuất"></button>
    </div>
  </header>

  <!-- ===================== LAYOUT: SIDEBAR + CONTENT ===================== -->
  <div class="layout">

    <!-- Sidebar điều hướng của role Hướng dẫn viên -->
    <aside class="sidebar">
      <nav class="side-nav" aria-label="Điều hướng hướng dẫn viên">
        <a class="side-link active" href="../guide-dashboard/guide-dashboard.html">Trang chủ</a>
        <a class="side-link" href="../guide-curated/guide-curated.html">Curated</a>
        <a class="side-link" href="../guide-locations/guide-locations.html">Địa điểm</a>
        <a class="side-link" href="../guide-itinerary-review/guide-itinerary-review.html">Review lịch trình</a>
        <a class="side-link" href="../guide-experiences/guide-experiences.html">Trải nghiệm</a>
        <a class="side-link" href="../guide-profile/guide-profile.html">Hồ sơ</a>
      </nav>
      <div class="side-spacer"></div>
      <div class="side-divider"></div>
      <div class="side-role">Hướng dẫn viên</div>
    </aside>

    <!-- Nội dung chính của màn hình Trang chủ -->
    <main class="content">
      <div class="content-rule" aria-hidden="true"></div>

      <!-- Khối 4 thẻ thống kê (render bằng JS) -->
      <section class="stats-grid" id="statsGrid" aria-label="Thống kê tổng quan"></section>

      <!-- Widget bộ sưu tập đang hoạt động: đồng bộ real-time với trang Curated -->
      <div class="card panel collections-panel">
        <div class="panel-head">
          <h2>Bộ sưu tập đang hoạt động</h2>
          <span class="count-pill" id="collectionsCount"></span>
        </div>
        <div class="stack" id="collectionsList"></div>
        <a class="panel-more" href="../guide-curated/guide-curated.html">Xem tất cả tại Curated →</a>
      </div>

      <section class="dash-grid">
        <!-- Danh sách lịch trình đang chờ review -->
        <div class="card panel">
          <div class="panel-head">
            <h2>Lịch trình cần review</h2>
            <span class="count-pill" id="pendingCount"></span>
          </div>
          <div class="stack" id="pendingList"></div>
        </div>

        <!-- Nhật ký hoạt động gần đây -->
        <div class="card panel">
          <div class="panel-head"><h2>Hoạt động gần đây</h2></div>
          <ul class="activity-list" id="activityList"></ul>
        </div>
      </section>
    </main>
  </div>

  <!-- Khu vực hiển thị toast (thông báo) -->
  <div class="toast-region" id="toastRegion"></div>

  <script src="guide-dashboard.js"></script>
</body>
</html>
